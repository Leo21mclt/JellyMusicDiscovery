<?xml version="1.0" encoding="UTF-8"?>
<!--
  Concept 1: Audio Jellyfish
  ===========================
  A stylized jellyfish with audio-waveform tentacles. Bell at top
  with subtle Jellyfin-colored circuit dots inside (tech). 5 wavy
  tentacles flowing down, dashed to read as pulsed audio waveforms.
  Free-floating composition — tentacles extend past the rim hint
  to reinforce "untethered / freedom".
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.0.dtd"
     viewBox="0 0 512 512" width="512" height="512">
  <title>JellyMusicDiscovery logo</title>
  <desc>Audio jellyfish — bell with embedded eighth note, dashed audio-waveform tentacles, constellation/circuit-network background. Each labeled group below is independently selectable in a graphical editor (Sketch / Figma / Inkscape / Illustrator).</desc>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="60%" stop-color="#152038"/>
      <stop offset="100%" stop-color="#0A0F1F"/>
    </radialGradient>
    <radialGradient id="highlight" cx="35%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#AA5CC3" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#AA5CC3" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#AA5CC3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00A4DC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#AA5CC3" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bellGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <!-- Note gradient: same Jellyfin blue → purple as the rim ring,
         but at full saturation (no transparency) so the note pops
         against the white bell. Vertical orientation so the note
         transitions from blue at the flag down to purple at the
         head, matching the ring's top-to-bottom direction. -->
    <linearGradient id="noteGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#00A4DC"/>
      <stop offset="100%" stop-color="#AA5CC3"/>
    </linearGradient>
    <filter id="discShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="10" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feFlood flood-color="#00A4DC" flood-opacity="0.85"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Disc -->
  <g id="disc" inkscape:label="Disc Background" filter="url(#discShadow)">
    <circle id="disc-fill" inkscape:label="Disc Fill"
            cx="256" cy="256" r="224" fill="url(#bgGrad)"/>
    <circle id="disc-highlight" inkscape:label="Disc Highlight (purple plum)"
            cx="256" cy="256" r="224" fill="url(#highlight)"/>
    <circle id="disc-ring" inkscape:label="Disc Inner Ring (blue→purple)"
            cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>
  </g>

  <!-- ============ Constellation/circuit network ============
       8 small nodes spaced around the inside of the disc rim,
       connected by thin lines into a triangulated pattern. Sits
       BEHIND the jellyfish (drawn before the bell + tentacles) so
       most of the network shows around the silhouette and only
       hints peek through where the jellyfish is transparent. Reads
       as either a circuit board or a star map — both align with
       music + tech + Jellyfin's connected-server vibe.
       Low opacity so it feels atmospheric, not foregrounded. -->
  <g id="constellation" inkscape:label="Constellation Network">
    <g id="constellation-lines" inkscape:label="Network Lines"
       stroke="#AA5CC3" stroke-width="1.8" stroke-opacity="0.30" fill="none">
      <line x1="105" y1="145" x2="256" y2="95"/>
      <line x1="256" y1="95"  x2="407" y2="145"/>
      <line x1="105" y1="145" x2="75"  y2="265"/>
      <line x1="75"  y1="265" x2="110" y2="395"/>
      <line x1="110" y1="395" x2="256" y2="425"/>
      <line x1="256" y1="425" x2="402" y2="395"/>
      <line x1="402" y1="395" x2="437" y2="265"/>
      <line x1="437" y1="265" x2="407" y2="145"/>
      <!-- Diagonal cross-connections for network feel -->
      <line x1="256" y1="95"  x2="75"  y2="265"/>
      <line x1="256" y1="95"  x2="437" y2="265"/>
      <line x1="75"  y1="265" x2="256" y2="425"/>
      <line x1="437" y1="265" x2="256" y2="425"/>
      <line x1="105" y1="145" x2="110" y2="395"/>
      <line x1="407" y1="145" x2="402" y2="395"/>
    </g>
    <g id="constellation-nodes" inkscape:label="Network Nodes"
       fill="#AA5CC3" fill-opacity="0.55">
      <circle cx="105" cy="145" r="4.5"/>
      <circle cx="407" cy="145" r="4.5"/>
      <circle cx="256" cy="95"  r="4.5"/>
      <circle cx="75"  cy="265" r="4.5"/>
      <circle cx="437" cy="265" r="4.5"/>
      <circle cx="110" cy="395" r="4.5"/>
      <circle cx="402" cy="395" r="4.5"/>
      <circle cx="256" cy="425" r="4.5"/>
    </g>
  </g>

  <!-- Jellyfish bell -->
  <g id="jellyfish-bell" inkscape:label="Jellyfish Bell" filter="url(#cyanGlow)">
    <path d="M 130 270
             C 130 130, 382 130, 382 270
             C 360 295, 340 280, 322 295
             C 304 280, 286 295, 268 280
             C 250 295, 232 280, 214 295
             C 196 280, 178 295, 160 285
             C 144 290, 134 280, 130 270 Z"
          fill="url(#bellGrad)"/>
  </g>

  <!-- Eighth note inside the bell — rotated ~20° for motion. The
       group rotation tilts the whole note as a unit; combined with
       the 100-style italic head, the composition leans forward like
       a played-and-flying note. Color is Jellyfin blue (#00A4DC)
       for strong contrast against the white bell. -->
  <!-- Note paths copied verbatim from the user's notes.svg source.
       Wrapped in a translate(210.79, 173.12) so the source's
       (37.21, 0.876) stem lands at (248, 174), then rotated -22°
       around the global pivot (252, 215). The head's internal
       rotate(-18) around (24, 72) is preserved from the source. -->
  <g id="note" inkscape:label="Eighth Note (in bell)"
     fill="url(#noteGrad)"
     transform="rotate(-22 252 215) translate(210.79 173.12)">
    <rect id="note-stem" inkscape:label="Note Stem"
          x="37.2184484" y="0.87618022" width="6" height="66" rx="2"/>
    <path id="note-flag" inkscape:label="Note Flag (scythe)"
          d="M43,1 C63,11 71,31 59,53 C67,37 59,23 43,15 L43,1 Z"/>
    <path id="note-head" inkscape:label="Note Head (italic oval)"
          d="M24,87 C35.045695,87 44,80.2842712 44,72 C44,71.8362447 43.9965012,71.6731024 43.9895567,71.5106126 C43.8936566,69.2667126 43.1406453,67.147272 41.8701157,65.2569859 C40.8559529,63.7481205 39.5120501,62.3852623 37.9094034,61.2216581 C34.3099839,58.6082939 29.4054167,57 24,57 C12.954305,57 4,63.7157288 4,72 C4,80.2842712 12.954305,87 24,87 Z"
          transform="translate(24 72) rotate(-18) translate(-24 -72)"/>
  </g>

  <!-- Audio-waveform tentacles. Dashed pattern reads as pulsed waveform. -->
  <g id="tentacles" inkscape:label="Tentacles (audio waveforms)"
     stroke="#FFFFFF" fill="none" stroke-linecap="round" filter="url(#cyanGlow)">
    <!-- Tentacle starts pulled up to y=283-285 so they originate
         inside the bell silhouette. The first ~10px of each tentacle
         is hidden behind the bell (white-on-white), which guarantees
         a flush "tentacle emerges from body" connection regardless
         of the bell's wavy bottom edge. -->
    <path id="tentacle-1" inkscape:label="Tentacle 1 (left)"
          d="M 156 285 Q 144 340, 162 380 T 144 470"
          stroke-width="9" stroke-dasharray="22 6 14 6"/>
    <path id="tentacle-2" inkscape:label="Tentacle 2"
          d="M 210 285 Q 218 350, 200 400 T 218 490"
          stroke-width="9" stroke-dasharray="18 6 12 6"/>
    <path id="tentacle-3" inkscape:label="Tentacle 3 (center)"
          d="M 256 283 Q 250 360, 262 420 T 252 500"
          stroke-width="9" stroke-dasharray="24 6 16 6"/>
    <path id="tentacle-4" inkscape:label="Tentacle 4"
          d="M 302 285 Q 294 350, 312 400 T 294 490"
          stroke-width="9" stroke-dasharray="18 6 12 6"/>
    <path id="tentacle-5" inkscape:label="Tentacle 5 (right)"
          d="M 356 285 Q 368 340, 350 380 T 368 470"
          stroke-width="9" stroke-dasharray="22 6 14 6"/>
  </g>
</svg>
